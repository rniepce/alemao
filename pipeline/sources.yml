# Fontes públicas de conteúdo a serem incorporadas no library.sqlite e dictionary.sqlite
# Edite conforme necessário.

dw_learn:
  enabled: false  # ativar quando dw_learn.py estiver implementado
  base_url: https://learngerman.dw.com
  # Lista de slugs/IDs de cursos. Preencha conforme curado.
  courses: []

wiktionary:
  enabled: false
  # Top N palavras mais frequentes em alemão a serem pré-carregadas no dicionário
  top_n_words: 5000
  word_list_url: ""  # URL para lista de frequência (ex: Leipzig Corpora)

tatoeba:
  enabled: false
  # URLs dos dumps (a baixar manualmente ou via script)
  pairs:
    - lang_a: deu
      lang_b: por
    - lang_a: deu
      lang_b: eng

seed_lessons:
