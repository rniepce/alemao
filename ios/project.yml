name: Alemao
options:
  bundleIdPrefix: dev.alemao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""           # preencha em ios/Alemao.xcconfig se quiser
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.7.1"

targets:
  Alemao:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Alemao
        excludes:
          - "Resources/PrebuiltContent/**"   # adicionado abaixo como folder reference
          - "Resources/Books/**"
    resources:
      # PrebuiltContent como folder reference: preserva o nome do diretório
      # e copia tudo dentro para o bundle.
      - path: Alemao/Resources/PrebuiltContent
        type: folder
      # Books só existe em builds pessoais (sideload).
      - path: Alemao/Resources/Books
        type: folder
        optional: true
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Alemao/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleDisplayName: Alemão
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: >-
          O Alemão usa o microfone para você praticar conversação em alemão.
        NSSpeechRecognitionUsageDescription: >-
          O Alemão usa reconhecimento de fala para avaliar sua pronúncia.
        NSCameraUsageDescription: >-
          O Alemão usa a câmera para reconhecer texto em alemão (placas, livros).
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: Alemao/Alemao.entitlements
